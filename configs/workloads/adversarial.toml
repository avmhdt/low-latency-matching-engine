# Tiny price range, qty 1-3, many FOK and modify, malformed requests and a small pool, so that
# empty sides, level churn, POOL_FULL and every reject path are hit all the time.
[engine]
price_min  = 0
price_max  = 63
max_orders = 16
[generator]
mid_start       = 32
mid_walk_sigma  = 10.0
half_spread     = 1
target_live     = 32
traders         = 3
[mix]
new_limit = 0.48
cancel    = 0.06
modify    = 0.18
ioc       = 0.06
fok       = 0.15
market    = 0.03
invalid   = 0.04
[price]
dist      = "geometric"
p         = 0.3
max_offset = 16
cross_prob = 0.2
floor     = 16
ceil      = 48
[size]
dist      = "uniform"
min       = 1
max       = 3
[cancel]
target    = "uniform"
[modify]
reduce    = 0.3
increase  = 0.3
reprice   = 0.4
